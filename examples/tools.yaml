# Example tool catalog - at least one tool per reversibility class,
# registered against the mock upstream in cmd/mockupstream.
#
# Every tool below carries a real reviewed_by/reviewed_at, not a TODO
# placeholder: each one's reversibility class, reviewer_role, and
# compensation semantics were deliberately designed by hand while this
# catalog was built, not auto-generated by blastradius - so this file
# loads cleanly whether or not require_reviewed_tools is set, and can
# stand as a real example of what a reviewed catalog looks like.
tools:
  - name: get_user
    description: "Look up a customer record by id"
    reversibility_class: B
    method: GET
    path: /users/{user_id}
    resource_arg: user_id
    reviewed_by: "RinWall maintainers"
    reviewed_at: "2026-09-13"
    args_schema:
      user_id:
        type: string
        required: true
        pattern: "^[0-9]+$"

  - name: log_event
    description: "Append a free-form note to the event log"
    reversibility_class: B
    method: POST
    path: /events
    reviewed_by: "RinWall maintainers"
    reviewed_at: "2026-09-13"
    args_schema:
      message:
        type: string
        required: true
        max_length: 500

  - name: update_customer_tier
    description: "Change a customer's pricing tier (silver or gold)"
    reversibility_class: A
    method: PATCH
    path: /users/{user_id}/tier
    resource_arg: user_id
    # compensate_with left empty: this tool re-issues itself with the
    # restored value on compensation. compensate_fields says which
    # argument comes from the captured pre-image.
    compensate_fields: ["tier"]
    # Class A doesn't normally need a reviewer - this is here for the
    # taint step-up path: if a call to this tool carries a tainted
    # argument (e.g. "tier" derived from a webpage the agent read rather
    # than typed by SalesManager), it's forced through the same
    # bound-approval flow Class C tier 3 uses, regardless of role.
    reviewer_role: SalesManager
    # Opts this tool into the model-based provenance add-on: when the
    # caller supplies a context_window, a real Anthropic call judges
    # whether "tier" plausibly traces back to the human's own words.
    provenance_judge: true
    reviewed_by: "RinWall maintainers"
    reviewed_at: "2026-09-13"
    pre_image:
      method: GET
      path: /users/{user_id}
    args_schema:
      user_id:
        type: string
        required: true
        pattern: "^[0-9]+$"
      tier:
        type: string
        required: true
        enum: ["silver", "gold"]

  # A second Class A tool on the same resource - lets one saga run touch
  # two independent compensable fields, so reverse-order
  # compensation has more than one step to actually demonstrate ordering on.
  - name: update_customer_status
    description: "Set a customer's account status (active or suspended)"
    reversibility_class: A
    method: PATCH
    path: /users/{user_id}/status
    resource_arg: user_id
    compensate_fields: ["status"]
    reviewer_role: admin-lead
    reviewed_by: "RinWall maintainers"
    reviewed_at: "2026-09-13"
    pre_image:
      method: GET
      path: /users/{user_id}
    args_schema:
      user_id:
        type: string
        required: true
        pattern: "^[0-9]+$"
      status:
        type: string
        required: true
        enum: ["active", "suspended"]

  - name: send_refund_email
    description: "Email a refund confirmation to a customer - cannot be recalled once sent"
    reversibility_class: C
    method: POST
    path: /refund-emails
    resource_arg: user_id
    deferrable: true
    hold_seconds: 20
    reviewer_role: support-lead
    reviewed_by: "RinWall maintainers"
    reviewed_at: "2026-09-13"
    args_schema:
      user_id:
        type: string
        required: true
        pattern: "^[0-9]+$"
      amount_cents:
        type: number
        required: true

  # Not deferrable, no natural dispatch delay - this is the one that
  # actually exercises tier 3 (bound, routed approval): whatever doesn't
  # match an envelope has nowhere to go but a real person.
  - name: close_account
    description: "Permanently close a customer's account"
    reversibility_class: C
    method: POST
    path: /users/{user_id}/close
    resource_arg: user_id
    reviewer_role: admin-lead
    reviewed_by: "RinWall maintainers"
    reviewed_at: "2026-09-13"
    args_schema:
      user_id:
        type: string
        required: true
        pattern: "^[0-9]+$"

  # The real Vault dynamic-secrets path (see internal/handler/dbquery.go) -
  # db_role names a real
  # Vault database secrets engine role that mints a genuine, unique
  # Postgres credential per session (a real CREATE ROLE against a real
  # database), not a biscuit token. Requires cmd/rinwall's db_dsn_template
  # config and a running Postgres with that role configured; see the
  # "Real DB/AWS dynamic secrets" section of docs/REFERENCE.md for the
  # exact setup this was validated against.
  - name: list_customer_orders
    description: "List recent orders (read-only, via a per-session database credential)"
    reversibility_class: B
    db_role: readonly-orders
    query: "SELECT customer_email, amount_cents, status FROM customer_orders ORDER BY id"
    reviewed_by: "RinWall maintainers"
    reviewed_at: "2026-09-13"
    args_schema: {}

  # The real Vault AWS dynamic-secrets path (see
  # internal/handler/awsquery.go) - aws_role names a real Vault AWS secrets engine role that
  # mints a genuine, fresh sts:AssumeRole credential on every call, not
  # cached per session. aws_s3_bucket is a real, environment-specific
  # bucket name (S3 bucket names are globally unique, so this is only
  # valid against the exact demo bucket this was set up against - a real
  # deployment would template this via whatever config management the org
  # already uses, not hand-type it here). Requires cmd/rinwall's aws_region
  # config and Vault's aws secrets engine configured; see the "Real DB/AWS
  # dynamic secrets" section of docs/REFERENCE.md for the exact setup.
  - name: get_order_document
    description: "Fetch one order document from S3 (read-only)"
    reversibility_class: B
    aws_role: s3-orders-reader
    aws_s3_bucket: jit-demo-1788901196
    aws_s3_key_arg: key
    reviewed_by: "RinWall maintainers"
    reviewed_at: "2026-09-13"
    args_schema:
      key:
        type: string
        required: true
        pattern: "^orders/[A-Za-z0-9_-]+\\.json$"

  # --- MCP-to-MCP passthrough --------------------------------------------
  # mcp_tool makes a tool MCP-backed: the proxy forwards the call onward to
  # an upstream MCP server (cmd/rinwall's mcp_upstream_url) as a real
  # tools/call, instead of an HTTP route. "=" means the upstream calls it by
  # this same name. This is what lets the firewall sit in front of an MCP
  # server someone already runs, which is why `blastradius --emit-registry`
  # can now produce a catalog that loads without a human hand-writing an
  # upstream HTTP route for every entry.
  #
  # These three point at cmd/mockupstream's own MCP endpoint (see
  # cmd/mockupstream/mcpserver.go), deliberately over the SAME user records
  # the HTTP-backed tools above mutate - so one proxy demonstrably fronts
  # HTTP, DB, AWS, and MCP upstreams at once, all through the same policy,
  # taint, class-gating, and saga machinery.
  - name: mcp_get_user
    description: "Look up a customer record by id, via the upstream MCP server"
    reversibility_class: B
    mcp_tool: "="
    resource_arg: user_id
    reviewed_by: "RinWall maintainers"
    reviewed_at: "2026-09-13"
    args_schema:
      user_id:
        type: string
        required: true

  # Class A over MCP: pre_image.mcp_tool names the upstream tool that reads
  # the prior state, so compensation has something real to restore from.
  # This is the MCP analog of pre_image.method/path, and it is the one thing
  # a scan genuinely cannot infer - which is why the emitter leaves it as a
  # TODO rather than guessing.
  - name: mcp_update_customer_tier
    description: "Change a customer's pricing tier, via the upstream MCP server"
    reversibility_class: A
    mcp_tool: "="
    resource_arg: user_id
    reviewer_role: admin-lead
    compensate_fields: [tier]
    reviewed_by: "RinWall maintainers"
    reviewed_at: "2026-09-13"
    pre_image:
      mcp_tool: mcp_get_user
    args_schema:
      user_id:
        type: string
        required: true
      tier:
        type: string
        required: true
        enum: [bronze, silver, gold]

  # Class C over MCP - unlike DB- and AWS-backed tools, MCP-backed tools are
  # not restricted to Class B. An upstream catalog is the general case and
  # routinely contains genuinely irreversible tools; refusing to load those
  # would push exactly the calls that most need gating back outside the
  # firewall.
  - name: mcp_close_account
    description: "Permanently close a customer's account, via the upstream MCP server"
    reversibility_class: C
    mcp_tool: "="
    resource_arg: user_id
    reviewer_role: admin-lead
    reviewed_by: "RinWall maintainers"
    reviewed_at: "2026-09-13"
    args_schema:
      user_id:
        type: string
        required: true

  # --- Visual provenance judge (screenshot-reasoning agents) -------------
  # The "computer use" tool shape: one generic tool, an action
  # discriminator, no semantic name per click - see
  # internal/visualprovenance's package doc and registry.Tool's own
  # VisualProvenanceJudge field for why this needs its own trigger path
  # independent of reversibility_class (kept Class B here deliberately, to
  # prove the mechanism reaches a class the pre-existing A/C-only taint
  # gate never would).
  - name: computer
    description: "Drive a screen: click, type, press a key, scroll, or take a screenshot"
    reversibility_class: B
    method: POST
    path: /computer-action
    reviewer_role: admin-lead
    visual_provenance_judge: true
    visual_judge_action_arg: action
    visual_judge_trigger_values: ["left_click", "type"]
    reviewed_by: "RinWall maintainers"
    reviewed_at: "2026-09-13"
    args_schema:
      action:
        type: string
        required: true
        enum: [left_click, type, key, screenshot, scroll]
      coordinate:
        type: string
      text:
        type: string

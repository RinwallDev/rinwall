<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="Servers by number of irreversible tools" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif">

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build for every platform
        env:
          CGO_ENABLED: "0"
        run: |
          set -e
          mkdir -p dist build
          # One archive per platform with a stable, version-free name, so
          # .../releases/latest/download/rinwall_<os>_<arch>.tar.gz always
          # fetches the newest release and the README's install line never
          # changes. Each archive holds one directory (never loose files that
          # could overwrite something in the directory it is extracted into).
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}; ext=""
            [ "$os" = windows ] && ext=".exe"
            pkg=rinwall_${os}_${arch}
            mkdir -p build/$pkg
            for cmd in rinwall blastradius devtoken auditverify; do
              name=rinwall-$cmd; [ "$cmd" = rinwall ] && name=rinwall
              GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" \
                -o build/$pkg/${name}${ext} ./cmd/$cmd
            done
            cp LICENSE build/$pkg/
            if [ "$os" = windows ]; then
              (cd build && zip -qr ../dist/$pkg.zip $pkg)
            else
              tar -C build -czf dist/$pkg.tar.gz $pkg
            fi
          done
          (cd dist && sha256sum * > SHA256SUMS)
          ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Image names must be lowercase; the repository path is not
      # (RinwallDev/rinwall), so derive the name instead of using it raw.
      - name: image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: cmd/rinwall/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ github.ref_name }}
            ${{ steps.img.outputs.name }}:latest

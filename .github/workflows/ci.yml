name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          out=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: test
        # Integration tests needing Postgres/AWS/Vault are env-gated and skip here;
        # the default suite needs nothing external.
        run: go test ./... -count=1
      - name: vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: build proxy image (no push)
        run: docker build -f cmd/rinwall/Dockerfile -t rinwall-proxy:ci .
      - name: build mockupstream image (no push)
        run: docker build -f cmd/mockupstream/Dockerfile -t rinwall-mockupstream:ci .
